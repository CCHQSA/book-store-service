<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Books</title>
    <style>
        main {
            max-width: 700px;
            margin: 1rem auto;
        }

        .book {
            border-bottom: 1px solid #ccc;
            padding: 0.75rem 0;
        }

        .book h2,
        .book p {
            margin: 0.35rem 0;
        }

        .book .view-info {
            margin-top: 0.5rem;
            display: inline-block;
            border: 1px solid #777;
            border-radius: 3px;
            padding: 0.3rem 0.6rem;
            color: inherit;
            text-decoration: none;
        }

        .add-book {
            display: inline-block;
            border: 1px solid #777;
            border-radius: 3px;
            padding: 0.3rem 0.6rem;
            color: inherit;
            text-decoration: none;
        }

        .delete-book {
            margin-left: 0.4rem;
        }

        .edit-book {
            display: inline-block;
            border: 1px solid #777;
            border-radius: 3px;
            padding: 0.3rem 0.6rem;
            color: inherit;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <h1>Books</h1>
    <p><a th:href="@{/home}">Home</a></p>
    <p class="error" th:if="${error != null}" th:text="${error}"></p>
    <p><a class="add-book" th:href="@{/books/add}"
          th:if="${#authorization.expression('hasRole(''EMPLOYEE'')')}">Add book</a></p>

    <p th:if="${#lists.isEmpty(books)}">No books are currently available.</p>

    <section th:unless="${#lists.isEmpty(books)}" aria-label="Book list">
        <article class="book" th:each="book : ${books}">
            <h2 th:text="${book.name}"></h2>
            <p><strong>Description</strong>: <span th:text="${book.description}"></span></p>
            <p><strong>Price</strong>: <span th:text="${book.price}"></span></p>
            <p><strong>Genre</strong>: <span th:text="${book.genre}"></span></p>
            <p><strong>Language</strong>: <span th:text="${book.language}"></span></p>
            <a class="view-info" th:href="@{/books/{name}(name=${book.name})}">View info</a>
            <a class="edit-book" th:href="@{/books/{name}/edit(name=${book.name})}"
               th:if="${#authorization.expression('hasRole(''EMPLOYEE'')')}">Edit</a>
            <form class="delete-book" th:action="@{/books/{name}/delete(name=${book.name})}"
                  method="post" th:if="${#authorization.expression('hasRole(''EMPLOYEE'')')}"
                  onsubmit="return confirm('Delete this book?');">
                <button type="submit">Delete</button>
            </form>
        </article>
    </section>
</main>
</body>
</html>
