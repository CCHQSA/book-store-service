<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${book.name}">Book details</title>
    <style>
        main {
            max-width: 700px;
            margin: 1rem auto;
        }

        .book-info {
            border-top: 1px solid #ccc;
            border-bottom: 1px solid #ccc;
            padding: 0.75rem 0;
        }

        .book-info p {
            margin: 0.5rem 0;
        }
    </style>
</head>
<body>
<main>
    <h1 th:text="${book.name}">Book title</h1>
    <section class="book-info" aria-label="Book details">
        <p><strong>Description</strong>: <span th:text="${book.description}"></span></p>
        <p><strong>Price</strong>: <span th:text="${book.price}"></span></p>
        <p><strong>Genre</strong>: <span th:text="${book.genre}"></span></p>
        <p><strong>Language</strong>: <span th:text="${book.language}"></span></p>
        <p><strong>Author</strong>: <span th:text="${book.author}"></span></p>
        <p><strong>Age group</strong>: <span th:text="${book.ageGroup}"></span></p>
        <p><strong>Publication date</strong>: <span th:text="${book.publicationDate}"></span></p>
        <p><strong>Pages</strong>: <span th:text="${book.pages}"></span></p>
        <p><strong>Characteristics</strong>: <span th:text="${book.characteristics}"></span></p>
    </section>
    <form th:action="@{/basket/add}" method="post"
          th:if="${#authorization.expression('hasRole(''CLIENT'')')}">
        <input type="hidden" name="bookName" th:value="${book.name}">
        <label for="quantity">Quantity</label>
        <input id="quantity" type="number" name="quantity" value="1" min="1" required>
        <button type="submit">Add to basket</button>
    </form>
    <p><a th:href="@{/books}">Back to books</a></p>
</main>
</body>
</html>
