<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Basket</title>
</head>
<body>
<main>
    <h1>Basket</h1>
    <p><a th:href="@{/books}">Continue shopping</a></p>
    <p th:if="${#lists.isEmpty(items)}">Your basket is empty.</p>
    <section th:unless="${#lists.isEmpty(items)}">
        <article th:each="item : ${items}">
            <span th:text="${item.bookName}"></span>
            <span th:text="${item.quantity}"></span>
            <form th:action="@{/basket/{name}/remove(name=${item.bookName})}" method="post">
                <button type="submit">Remove</button>
            </form>
        </article>
        <form th:action="@{/orders/submit}" method="post">
            <button type="submit">Submit order</button>
        </form>
    </section>
</main>
</body>
</html>
